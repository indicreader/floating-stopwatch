name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank to use version from app/build.gradle)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Version & Prepare Artifact
        id: prepare_artifact
        run: |
          # Read version from output metadata if available, otherwise fallback to build.gradle
          if [ -f app/build/outputs/apk/release/output-metadata.json ]; then
            VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          else
            VERSION=$(grep -E 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
          fi

          echo "Detected version: $VERSION"
          
          # Determine release tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi

          echo "Release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Copy and rename release APK
          cp app/build/outputs/apk/release/app-release.apk "PracticeTimerOverlay-${TAG}.apk"
          echo "artifact_path=PracticeTimerOverlay-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.tag }}
          name: "Practice Timer Overlay ${{ steps.prepare_artifact.outputs.tag }}"
          files: ${{ steps.prepare_artifact.outputs.artifact_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
